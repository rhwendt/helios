# Collect Device Diagnostics
# Read-only diagnostic collection for troubleshooting
apiVersion: helios.io/v1alpha1
kind: Runbook
metadata:
  name: collect-diagnostics
  namespace: helios-automation
  labels:
    helios.io/category: diagnostic
    helios.io/risk: low
spec:
  name: Collect Device Diagnostics
  description: |
    Gathers comprehensive diagnostic information from a device.

    This is a READ-ONLY runbook - no configuration changes are made.
    Safe to run at any time for troubleshooting.

    COLLECTS:
    - System information (hostname, uptime, version)
    - CPU and memory utilization
    - Interface states and counters
    - BGP neighbor summary
    - Routing table summary
    - Recent logs/events

    OUTPUT:
    Results are stored in the execution status and can be viewed via:
    - kubectl describe runbookexecution <name>
    - Grafana Runbook Dashboard

  category: diagnostic
  riskLevel: low
  requiresApproval: false
  allowedRoles:
    - network-viewer
    - network-engineer
    - network-admin
  cooldown: "1m"

  parameters:
    - name: device
      type: device
      required: true
      description: Target device hostname

    - name: include_routing
      type: boolean
      required: false
      default: true
      description: Include BGP and routing table info

    - name: include_interfaces
      type: boolean
      required: false
      default: true
      description: Include interface counters (can be verbose)

    - name: include_hardware
      type: boolean
      required: false
      default: false
      description: Include hardware component status

  steps:
    - name: Get System Information
      action: gnmi_get
      timeout: 15s
      config:
        target: "{{device}}:6030"
        path: "/system/state"

    - name: Get System Memory
      action: gnmi_get
      timeout: 15s
      config:
        target: "{{device}}:6030"
        path: "/system/memory/state"

    - name: Get CPU Utilization
      action: gnmi_get
      timeout: 15s
      config:
        target: "{{device}}:6030"
        path: "/system/cpus/cpu/state"

    - name: Get Interface Summary
      action: gnmi_get
      timeout: 30s
      condition: "{{include_interfaces}} == true"
      config:
        target: "{{device}}:6030"
        path: "/interfaces/interface/state"

    - name: Get Interface Counters
      action: gnmi_get
      timeout: 30s
      condition: "{{include_interfaces}} == true"
      config:
        target: "{{device}}:6030"
        path: "/interfaces/interface/state/counters"

    - name: Get BGP Neighbors
      action: gnmi_get
      timeout: 30s
      condition: "{{include_routing}} == true"
      config:
        target: "{{device}}:6030"
        path: "/network-instances/network-instance[name=default]/protocols/protocol[identifier=BGP][name=BGP]/bgp/neighbors/neighbor/state"

    - name: Get Route Count
      action: gnmi_get
      timeout: 30s
      condition: "{{include_routing}} == true"
      config:
        target: "{{device}}:6030"
        path: "/network-instances/network-instance[name=default]/afts/ipv4-unicast/state"

    - name: Get LLDP Neighbors
      action: gnmi_get
      timeout: 15s
      config:
        target: "{{device}}:6030"
        path: "/lldp/interfaces/interface/neighbors"

    - name: Get Hardware Components
      action: gnmi_get
      timeout: 30s
      condition: "{{include_hardware}} == true"
      config:
        target: "{{device}}:6030"
        path: "/components/component/state"

    - name: Get Alarms
      action: gnmi_get
      timeout: 15s
      config:
        target: "{{device}}:6030"
        path: "/system/alarms/alarm/state"
